[global]
   workgroup = WORKGROUP
   server string = Proxmox-Server-1
   netbios name = SERVER1
   server role = standalone server
   security = user
   map to guest = Bad User
   server min protocol = SMB2
   interfaces = lo vmbr0
   bind interfaces only = yes
   hosts allow = 127. 192.168.100.0/23
   hosts deny = 0.0.0.0/0
   load printers = no
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/log.%m
   max log size = 1000

[backup_drive]
   comment = Backup drive (NTFS, /mnt/nfs/backup_drive)
   path = /mnt/nfs/backup_drive
   browseable = yes
   read only = no
   guest ok = yes
   create mask = 0664
   directory mask = 0775
