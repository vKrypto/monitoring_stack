# Anonymous (no password) FTP for the backup drive. LAN-only: bound to the vmbr0 address.
Include /etc/proftpd/modules.conf
UseIPv6                 off
ServerName              "Backup drive (anonymous FTP)"
ServerType              standalone
DefaultServer           on
DefaultAddress          192.168.100.4
SocketBindTight         on
Port                    21
User                    proftpd
Group                   nogroup
Umask                   000 000
MaxInstances            20
MaxClientsPerHost       5
TimeoutIdle             300
PassivePorts            40000 40050
MasqueradeAddress       192.168.100.4
AllowOverwrite          on
UseReverseDNS           off
DefaultRoot             ~
RequireValidShell       off
ShowSymlinks            off
TransferLog             /var/log/proftpd/xferlog
SystemLog               /var/log/proftpd/proftpd.log

# Only the anonymous account may log in; every real system account is refused.
<Limit LOGIN>
  DenyAll
</Limit>

<Anonymous /mnt/nfs/backup_drive>
  User                  ftp
  Group                 nogroup
  UserAlias             anonymous ftp
  AnonRequirePassword   off
  Umask                 000 000
  <Limit LOGIN>
    AllowAll
  </Limit>
  <Limit ALL>
    AllowAll
  </Limit>
</Anonymous>
